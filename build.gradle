apply plugin: "java"

sourceSets.main.java.srcDirs = ["src"]
sourceSets.main.java.exclude("test/**")

sourceSets {
    test {
        java.srcDirs = ["src/test/java"]
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

ext{
    mindustryVersion = "v159.7"
}

repositories{
    mavenCentral()

    ivy{
        url = 'https://github.com/'
        patternLayout{ artifact(
            '/[organisation]/[module]/releases/download/[revision]/dependencies.jar'
        )}
        metadataSources{ artifact() }

        content{
            includeVersion("Anuken", "Mindustry", mindustryVersion)
        }
    }
}

java{
    targetCompatibility = JavaVersion.VERSION_17
    sourceCompatibility = JavaVersion.VERSION_17
}

dependencies{
    compileOnly "Anuken:Mindustry:$mindustryVersion"
    testCompileOnly "Anuken:Mindustry:$mindustryVersion"
    testRuntimeOnly "Anuken:Mindustry:$mindustryVersion"
}

jar{
    archiveFileName = "ic2m.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from{
        configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) }
    }

    from(projectDir){
        include "mod.hjson"
        include "content/**"
        include "sprites/**"
        include "bundles/**"
    }
}

task deploy(type: Copy, dependsOn: jar){
    def projectName = project.name
    def os = System.getProperty("os.name").toLowerCase()
    def dir
    if(os.contains("linux")){
        dir = new File(System.getenv("HOME"), ".local/share/Mindustry/mods")
    }else if(os.contains("windows")){
        dir = new File(System.getenv("APPDATA"), "Mindustry/mods")
    }else{
        dir = new File(System.getProperty("user.home"), "Library/Application Support/Mindustry/mods")
    }
    from jar.destinationDirectory
    into dir
    dir.mkdirs()
}

task euTest(type: JavaExec, dependsOn: testClasses){
    description = "Runs the standalone EU transfer regression harness."
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "ic2m.EuTransferHarness"
}

task euIntegrationTest(type: JavaExec, dependsOn: [jar, testClasses]){
    description = "Runs the headless Mindustry EU transfer smoke test."
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "ic2m.EuIntegrationHarness"
    systemProperty "user.home", file("${buildDir}/eu-test-home").absolutePath
}

task euOreTest(type: JavaExec, dependsOn: [jar, testClasses]){
    description = "Runs the headless IC2 ore processing regression harness."
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "ic2m.EuOreProcessingHarness"
    systemProperty "user.home", file("${buildDir}/eu-test-home").absolutePath
}

task euContentTest(type: JavaExec, dependsOn: jar){
    description = "Verifies runtime content and assets are packaged in the mod JAR."
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "ic2m.EuJarContentHarness"
}

task powerArmorTest(type: JavaExec, dependsOn: [jar, testClasses]){
    description = "Headless smoke test for the Power Armor Suit + Bench wiring."
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "ic2m.PowerArmorHarness"
    systemProperty "user.home", file("${buildDir}/pa-test-home").absolutePath
}
